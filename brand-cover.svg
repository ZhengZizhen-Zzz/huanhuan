<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">缓缓 Huanhuan</title><desc id="desc">给想吃的念头，一个暂停的地方。状态觉察、趣味互动、日历积累。</desc>
<rect width="1280" height="440" rx="24" fill="#eeebf3"/>
<circle cx="1180" cy="25" r="232" fill="#e5dfec"/><circle cx="1080" cy="428" r="205" fill="#e3e8e3"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="62" y="49" width="40" height="40" rx="13" fill="#433b50"/><path d="M76 61v16m12-16v16" stroke="#faf8fc" stroke-width="4"/>
<text x="118" y="78" font-size="25" font-weight="650" fill="#443b50">缓缓 <tspan font-size="18" font-weight="400" fill="#81748e">HUANHUAN</tspan></text>
<text x="60" y="171" font-size="46" font-weight="650" fill="#3f3749">给想吃的念头，</text>
<text x="60" y="238" font-size="46" font-weight="650" fill="#3f3749">一个暂停的地方。</text>
<text x="64" y="294" font-size="20" fill="#84778e">把一次小暂停，留成看得见的积累。</text>
<path d="M64 330h586" stroke="#d6cfdf"/>
<text x="64" y="373" font-size="16" fill="#71627f">状态觉察</text><circle cx="168" cy="367" r="2" fill="#b0a5b9"/>
<text x="188" y="373" font-size="16" fill="#71627f">趣味互动</text><circle cx="292" cy="367" r="2" fill="#b0a5b9"/>
<text x="312" y="373" font-size="16" fill="#71627f">日历积累</text>
<g transform="translate(886 88) rotate(9 123 145)">
<rect x="6" y="7" width="244" height="279" rx="4" fill="#cbc1d4" opacity=".25"/>
<rect width="244" height="279" rx="4" fill="#faf9f5" stroke="#d9d1df"/>
<text x="23" y="40" font-size="13" letter-spacing="2" fill="#96879f">A LITTLE PAUSE</text><path d="M21 55h202" stroke="#e6dfe9"/>
<g fill="#ddd5e4"><circle cx="39" cy="91" r="5"/><circle cx="80" cy="91" r="5"/><circle cx="121" cy="91" r="5"/><circle cx="162" cy="91" r="5"/><circle cx="203" cy="91" r="5"/><circle cx="39" cy="134" r="5"/><circle cx="80" cy="134" r="5"/><circle cx="121" cy="134" r="5"/><circle cx="162" cy="134" r="5"/><circle cx="203" cy="134" r="5"/></g>
<circle cx="80" cy="134" r="18" fill="#c2b0d1"/><path d="m72 134 6 6 11-12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
<text x="24" y="216" font-size="22" fill="#6e5c7f">这一次，也算数。</text><text x="24" y="246" font-size="12" fill="#a295ac">一枚印章 · 一点积累</text>
</g>
